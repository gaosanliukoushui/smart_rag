[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Keep CI focused on syntax-level and high-confidence runtime errors for now.
# The existing codebase has many cosmetic unused-import findings that should be
# cleaned in a dedicated pass instead of mixed into the RAG credibility upgrade.
select = ["E9", "F63", "F7"]
