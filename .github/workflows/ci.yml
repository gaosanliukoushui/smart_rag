name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check app tests scripts
      - name: Unit tests
        run: pytest -q tests/unit
      - name: RAG eval smoke test
        run: python scripts/run_rag_eval.py --dataset evals/qa_set.jsonl --compare-modes
      - name: Agent eval smoke test
        run: python scripts/run_agent_eval.py --dataset agent_evals/tasks.jsonl
      - name: Agent execute eval smoke test
        run: python scripts/run_agent_eval.py --dataset agent_evals/tasks.jsonl --mode execute

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build
        run: npm run build
